<?xml version="1.0" encoding="UTF-8"?>
<!-- Overlapping fills: a black disc under a grey square, with a white disc on top of both. -->
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="100mm" viewBox="0 0 160 100">
  <circle cx="50" cy="50" r="40" fill="#000000"/>
  <rect x="60" y="20" width="80" height="60" fill="#808080"/>
  <circle cx="75" cy="50" r="18" fill="#ffffff"/>
</svg>
