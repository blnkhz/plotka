name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Download Electron once up front. Otherwise the parallel e2e workers race to download it
      # on first launch and one of them fails.
      - run: pnpm --filter @plotka/desktop exec node node_modules/electron/install.js
      - run: pnpm test:e2e
