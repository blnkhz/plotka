appId: org.plotterstudio.app
productName: Plotter Studio
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - '**/node_modules/@serialport/bindings-cpp/**'
mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [universal]
  # Signing and notarization are off until there is an Apple Developer account.
  # To enable: set CSC_LINK / CSC_KEY_PASSWORD and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID in CI, remove `identity: null`, and set `notarize: true`.
  identity: null
  notarize: false
npmRebuild: true
