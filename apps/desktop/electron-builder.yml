appId: org.plotka.app
productName: Plotka
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # Only the macOS serialport binary is needed in a Mac build.
  - '!**/node_modules/@serialport/bindings-cpp/prebuilds/{android,linux,win32}-*/**'
# The licence and third-party notices (fonts included) ship inside the app, in Resources.
extraResources:
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asarUnpack:
  - '**/node_modules/@serialport/bindings-cpp/**'
mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [universal]
  # Signing and notarization are off until there is an Apple Developer account.
  # To enable: set CSC_LINK / CSC_KEY_PASSWORD and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID in CI, remove `identity: null`, and set `notarize: true`.
  identity: null
  notarize: false
# serialport ships a universal (x64 + arm64) N-API prebuild, which Electron loads as is, so
# nothing needs compiling. Everything else is bundled into out/ by electron-vite; only
# `dependencies` (just serialport) are packaged.
npmRebuild: false
